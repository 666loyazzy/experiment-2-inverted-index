name: Compile and verify inverted index
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn -B package dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Check punctuation case stopwords and document counts
        run: |
          mkdir -p target/fixture
          printf 'Data, DATA! the hadoop. search-search\n' > target/fixture/document01.txt
          printf 'data index; Hadoop hadoop 123\nthe THE\n' > target/fixture/document02.txt
          java -cp "target/classes:$(cat classpath.txt)" InvertedIndex target/fixture target/fixture-index stopwords.txt
          python3 verify.py target/fixture stopwords.txt target/fixture-index/part-r-00000
          printf 'data\t<document01.txt,2>;<document02.txt,1>;<total,3>.\nhadoop\t<document01.txt,1>;<document02.txt,2>;<total,3>.\nindex\t<document02.txt,1>;<total,1>.\nsearch\t<document01.txt,2>;<total,2>.\n' > target/fixture-expected.txt
          diff -u target/fixture-expected.txt target/fixture-index/part-r-00000
      - name: Verify all ten public documents
        run: |
          java -cp "target/classes:$(cat classpath.txt)" InvertedIndex corpus target/corpus-index stopwords.txt
          python3 verify.py corpus stopwords.txt target/corpus-index/part-r-00000 | tee target/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-local-validation
          path: |
            target/corpus-index/part-r-00000
            target/verification.json
